<style>
:root {
  --main:#8B0000;
  --gold:#f4c542;
  --cream:#fff8e7;
  --dark:#2c1b12;
}

/* HERO ẢNH LỚN */
.detail-hero {
  width: 100%;
  height: 750px;
  position: relative;
  overflow: hidden;
}

.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;   /* ưu tiên phần trên ảnh */
  filter: brightness(1.05) contrast(1.1) saturate(1.15);  /* sáng, sắc hơn */
  transition: transform 0.8s ease;
}

.detail-hero:hover img {
  transform: scale(1.03);   /* hiệu ứng zoom nhẹ khi hover */
}

.detail-hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0.1) 40%,
    rgba(44,27,18,0.75) 80%,
    rgba(44,27,18,0.92) 100%
  );
  display: flex;
  align-items: flex-end;
  padding: 50px 100px;
}

.detail-hero-text .era-badge {
  display: inline-block;
  background: var(--gold);
  color: var(--dark);
  padding: 6px 18px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
}

.detail-hero-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  color: white;
  line-height: 1.3;
  margin-bottom: 12px;
  max-width: 800px;
}

.detail-hero-text .meta {
  display: flex;
  gap: 20px;
  color: rgba(255,255,255,0.75);
  font-size: 14px;
}

/* NỘI DUNG */
.detail-content {
  max-width: 820px;
  margin: 0 auto;
  padding: 60px 20px 100px;
}

/* ĐOẠN MỞ ĐẦU */
.lead-text {
  font-size: 20px;
  color: var(--dark);
  line-height: 1.9;
  font-weight: 500;
  border-left: 4px solid var(--main);
  padding-left: 20px;
  margin-bottom: 40px;
}

/* ĐOẠN VĂN */
.story-paragraph {
  font-size: 17px;
  color: #333;
  line-height: 2;
  margin-bottom: 28px;
  opacity: 1;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.story-paragraph.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ẢNH GIỮA BÀI */
.story-img-mid {
  width: 100%;
  border-radius: 16px;
  margin: 36px 0;
  object-fit: cover;
  height: 320px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.story-img-mid.visible {
  opacity: 1;
  transform: translateY(0);
}

/* QUOTE NỔI BẬT */
.story-quote {
  background: #fff3cd;
  border-left: 5px solid var(--gold);
  padding: 24px 30px;
  border-radius: 0 12px 12px 0;
  margin: 36px 0;
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--dark);
  font-style: italic;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.story-quote.visible {
  opacity: 1;
  transform: translateY(0);
}

.story-quote cite {
  display: block;
  margin-top: 10px;
  font-size: 14px;
  color: #b85c00;
  font-style: normal;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
}

/* TIÊU ĐỀ PHẦN */
.story-section-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: var(--main);
  margin: 48px 0 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid #f4c54240;
}

/* KẾT THÚC */
.story-end {
  text-align: center;
  padding: 50px 20px;
  background: linear-gradient(rgba(255,248,231,0), rgba(255,248,231,1));
}

.story-end h3 {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  color: var(--dark);
  margin-bottom: 16px;
}

.story-end p {
  color: #666;
  margin-bottom: 30px;
  font-size: 16px;
}

.btn-back {
  padding: 14px 32px;
  background: var(--main);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: 0.3s;
  margin: 0 8px;
}

.btn-back:hover {
  background: var(--gold);
  color: black;
}

.btn-next {
  padding: 14px 32px;
  background: white;
  color: var(--main);
  border: 2px solid var(--main);
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: 0.3s;
  margin: 0 8px;
}

.btn-next:hover {
  background: var(--main);
  color: white;
}

/* PROGRESS BAR */
.reading-progress {
  position: fixed;
  top: 80px;
  left: 0;
  height: 3px;
  background: var(--main);
  z-index: 999;
  transition: width 0.1s;
}

/* RESPONSIVE */
/* INTERACTIVE GAME SECTION */
.game-section { margin-top: 60px; border-top: 2px solid #f4c54240; padding-top: 48px; }
.game-section-label { font-size: 13px; color: #b85c00; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-weight: 600; }
.game-section h2 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--main); margin-bottom: 24px; }
.game-scene { display: none; animation: fadeIn 0.6s ease; }
.game-scene.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.game-text { font-size: 17px; color: #333; line-height: 2; margin-bottom: 16px; }
.game-dialogue { background: #fff8e7; border-left: 4px solid #f4c542; border-radius: 0 10px 10px 0; padding: 14px 20px; margin: 16px 0; font-style: italic; color: var(--dark); font-size: 17px; }
.game-choices { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.game-choice { background: white; border: 1.5px solid #ddd; border-radius: 10px; padding: 14px 20px; font-size: 16px; font-family: 'Poppins', sans-serif; cursor: pointer; text-align: left; transition: 0.25s; display: flex; gap: 12px; align-items: flex-start; }
.game-choice:hover { border-color: var(--main); background: #fff8e7; transform: translateX(4px); }
.game-choice-letter { width: 26px; height: 26px; min-width: 26px; border-radius: 50%; background: #8B000015; border: 1px solid var(--main); color: var(--main); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.game-outcome { padding: 18px 22px; border-radius: 12px; margin: 16px 0; font-size: 16px; line-height: 1.8; }
.game-outcome.bad { background: #fff0f0; border: 1px solid #ffcccc; }
.game-outcome.good { background: #f0fff4; border: 1px solid #b2dfdb; }
.game-continue { margin-top: 24px; padding: 13px 28px; background: var(--main); color: white; border: none; border-radius: 10px; font-size: 16px; font-family: 'Poppins', sans-serif; cursor: pointer; transition: 0.3s; }
.game-continue:hover { background: #6b0000; }
.game-result { text-align: center; padding: 32px 16px; background: #fff8e7; border-radius: 16px; border: 1px solid #f4c542; }
.game-result h3 { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--dark); margin-bottom: 10px; }
.game-restart { margin-top: 16px; padding: 12px 28px; background: transparent; border: 1.5px solid var(--main); color: var(--main); border-radius: 10px; font-size: 15px; font-family: 'Poppins', sans-serif; cursor: pointer; transition: 0.3s; }
.game-restart:hover { background: var(--main); color: white; }
@media(max-width: 768px) {
  .detail-hero { height: 350px; }
  .detail-hero-overlay { padding: 30px 20px; }
  .detail-hero-text h1 { font-size: 28px; }
  .detail-content { padding: 40px 16px 80px; }
  .lead-text { font-size: 17px; }
  .story-paragraph { font-size: 15px; }
}
/* VIDEO SECTION FOR DETAIL PAGE */
.story-video-section {
  max-width: 820px;
  margin: 60px auto 40px;
  padding: 0 20px;
  animation: fadeInUp 0.8s ease-out;
}

.story-video-label {
  font-size: 13px;
  color: #b85c00;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  font-family: 'Poppins', sans-serif;
}

.story-video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #1a1a2e;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(139, 0, 0, 0.2);
  border: 1px solid rgba(139, 0, 0, 0.3);
}

.story-video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

// SCROLL ANIMATION
function initScrollAnimations() {
  const els = document.querySelectorAll('.story-paragraph, .story-img-mid, .story-quote');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.15 });
  els.forEach(el => observer.observe(el));
}

// READING PROGRESS BAR
window.addEventListener('scroll', () => {
  const total = document.body.scrollHeight - window.innerHeight;
  const pct = total > 0 ? (window.scrollY / total) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
});

let gamePoints = 0;
let gameBadge = '';

function buildGame(g) {
  gamePoints = 0; gameBadge = '';
  let html = `<div class="game-section"><div class="game-section-label">⚔️ Thử thách nhập vai</div><h2>${g.title}</h2>`;
  html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
    <div style="font-size:14px;color:#666;">Điểm:</div>
    <div id="game-score-display" style="font-size:20px;font-weight:700;color:#8B0000;">0</div>
    <div id="game-badge-display" style="font-size:13px;padding:4px 12px;background:#fff8e7;border:1px solid #f4c542;border-radius:20px;color:#b85c00;"></div>
  </div>`;

  g.scenes.forEach(sc => {
    html += `<div class="game-scene ${sc.id==='s1'?'active':''}" id="gs-${sc.id}">`;

    // QUIZ
    if (sc.quiz) {
      html += `<div style="background:#fff8e7;border:2px solid #f4c542;border-radius:12px;padding:20px;margin-bottom:20px;">
        <div style="font-size:13px;color:#b85c00;font-weight:600;margin-bottom:8px;">📝 Câu hỏi kiến thức</div>
        ${sc.quiz.image ? `<img src="images/${sc.quiz.image}" style="width:100%;height:160px;object-fit:cover;border-radius:8px;margin-bottom:12px;">` : ''}
        <p style="font-size:16px;font-weight:600;color:#2c1b12;margin-bottom:12px;">${sc.quiz.question}</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${sc.quiz.options.map((opt,i) => `
            <button onclick="answerQuiz(this,${i},${sc.quiz.correct},'gs-${sc.id}')"
              style="padding:10px 16px;background:white;border:1.5px solid #ddd;border-radius:8px;font-size:15px;cursor:pointer;text-align:left;transition:0.2s;">
              ${String.fromCharCode(65+i)}. ${opt}
            </button>`).join('')}
        </div>
        <div id="quiz-result-${sc.id}" style="margin-top:12px;font-size:14px;display:none;"></div>
      </div>`;
    }

    if (sc.text) sc.text.forEach(t => html += `<p class="game-text">${t}</p>`);
    if (sc.dialogue) html += `<div class="game-dialogue">${sc.dialogue}</div>`;

    // OUTCOME với giải thích chi tiết
    if (sc.outcome) {
      html += `<div class="game-outcome ${sc.outcome.type}">
        ${sc.outcome.image ? `<img src="images/${sc.outcome.image}" style="width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:10px;">` : ''}
        ${sc.outcome.text}
        ${sc.outcome.detailed ? sc.outcome.detailed : ''}
      </div>`;
    }

    // CHOICES với ảnh + giải thích
    if (sc.choices) {
      html += `<div class="game-choices">`;
      sc.choices.forEach((c,i) => {
        html += `<button class="game-choice" onclick="gameChoose('${c.next}',${c.points||10})">
          ${c.image ? `<img src="images/${c.image}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0;">` : ''}
          <div style="flex:1;">
            <div style="display:flex;gap:8px;align-items:flex-start;">
              <span class="game-choice-letter">${String.fromCharCode(65+i)}</span>
              <span>${c.label}</span>
            </div>
            ${c.explanation ? `<div style="font-size:13px;color:#888;margin-top:6px;font-style:italic;">${c.explanation}</div>` : ''}
          </div>
        </button>`;
      });
      html += `</div>`;
    }

    if (sc.next) html += `<button class="game-continue" onclick="gameChoose('${sc.next}',0)">Tiếp tục →</button>`;

    // KẾT THÚC với badge
    if (sc.isEnd) {
      html += `<div class="game-result">
       

<!-- SAU ĐÓ MỚI ĐẾN: <div class="story-end"> -->
        <p>${sc.endDesc||''}</p>
        <div id="final-badge" style="font-size:22px;margin:12px 0;"></div>
        <div id="final-points" style="font-size:18px;font-weight:700;color:#8B0000;margin-bottom:16px;"></div>
        <button class="game-restart" onclick="gameRestart()">🔄 Chơi lại</button>
      </div>`;
    }

    html += `</div>`;
  });
  return html + '</div>';
}

function answerQuiz(btn, chosen, correct, sceneId) {
  const container = btn.parentElement;
  const resultEl = document.getElementById('quiz-result-' + sceneId.replace('gs-',''));
  container.querySelectorAll('button').forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.style.background = '#d4edda'; btn.style.borderColor = '#28a745';
    gamePoints += 10;
    resultEl.innerHTML = '✅ Đúng rồi! +10 điểm';
    resultEl.style.color = '#28a745';
  } else {
    btn.style.background = '#f8d7da'; btn.style.borderColor = '#dc3545';
    container.querySelectorAll('button')[correct].style.background = '#d4edda';
    container.querySelectorAll('button')[correct].style.borderColor = '#28a745';
    resultEl.innerHTML = '❌ Sai rồi! Đáp án đúng được tô xanh.';
    resultEl.style.color = '#dc3545';
  }
  resultEl.style.display = 'block';
  updateScoreDisplay();
}

function gameChoose(sceneId, pts) {
  gamePoints += (pts || 10);
  updateScoreDisplay();
  document.querySelectorAll('.game-scene').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('gs-' + sceneId);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({behavior:'smooth', block:'start'});
    // Nếu là màn kết thúc
    const finalBadge = el.querySelector('#final-badge');
    if (finalBadge) {
      if (gamePoints >= 60) { gameBadge = '🏛️ Chiến Lược Gia'; }
      else if (gamePoints >= 35) { gameBadge = '⚔️ Tướng Quân'; }
      else { gameBadge = '📚 Học Viên'; }
      finalBadge.textContent = gameBadge;
      el.querySelector('#final-points').textContent = `Tổng điểm: ${gamePoints} điểm`;
    }
  }
}

function updateScoreDisplay() {
  const el = document.getElementById('game-score-display');
  const badgeEl = document.getElementById('game-badge-display');
  if (el) el.textContent = gamePoints;
  if (badgeEl) {
    if (gamePoints >= 60) badgeEl.textContent = '🏛️ Chiến Lược Gia';
    else if (gamePoints >= 35) badgeEl.textContent = '⚔️ Tướng Quân';
    else badgeEl.textContent = '📚 Học Viên';
  }
}

function gameRestart() {
  gamePoints = 0; gameBadge = '';
  updateScoreDisplay();
  document.querySelectorAll('.game-scene').forEach(s => s.classList.remove('active'));
  const first = document.querySelector('.game-scene');
  if (first) { first.classList.add('active'); first.scrollIntoView({behavior:'smooth'}); }
}

function renderTimeline(id) {
  const data = timelineData[id];
  if (!data) return;
  const container = document.createElement('div');
  container.style.cssText = `max-width:820px; margin:0 auto 40px; padding:0 20px;`;
  container.innerHTML = `
    <div style="background:#fff8e7;border:1px solid #f4c54260;border-radius:16px;padding:24px 28px;">
      <div style="font-size:13px;color:#b85c00;font-weight:600;letter-spacing:2px;margin-bottom:20px;">⏰ TIMELINE SỰ KIỆN</div>
      <div style="position:relative;">
        <div style="position:absolute;left:70px;top:0;bottom:0;width:2px;background:#f4c54260;"></div>
        ${data.map(item => `
          <div style="display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;">
            <div style="min-width:60px;text-align:right;font-size:12px;font-weight:600;color:#8B0000;padding-top:3px;">${item.year}</div>
            <div class="tl-dot" style="width:12px;height:12px;min-width:12px;border-radius:50%;
              background:${item.highlight ? '#8B0000' : '#f4c542'};
              border:2px solid ${item.highlight ? '#8B0000' : '#c9a000'};
              margin-top:4px;transition:transform 0.2s;position:relative;z-index:1;"></div>
            <div style="font-size:15px;color:${item.highlight ? '#8B0000' : '#444'};
              font-weight:${item.highlight ? '600' : '400'};padding-top:1px;">${item.event}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  const leadText = document.querySelector('.lead-text');
  if (leadText) leadText.parentNode.insertBefore(container, leadText);
}

try {
  renderStory();
} catch(e) {
  document.getElementById('storyContainer').innerHTML =
    '<div style="padding:50px;color:red;font-size:20px">LỖI: ' + e.message + '</div>';
}
</script>
</body>
</html>
